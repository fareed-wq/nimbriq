name: Ansible CI

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-ci.yml"

  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.20.1
          ansible-galaxy collection install amazon.aws:10.1.2

      - name: Show Ansible version
        run: ansible --version

      - name: Validate inventory
        working-directory: ansible
        run: ansible-inventory --graph

      - name: Syntax check system info playbook
        working-directory: ansible
        run: ansible-playbook playbooks/system-info.yml --syntax-check

      - name: Syntax check webserver playbook
        working-directory: ansible
        run: ansible-playbook playbooks/webserver.yml --syntax-check
